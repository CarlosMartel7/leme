# Bundled workflow skills.
#
# Each [[skills]] entry is one skill directory in agents/skills/<name>/. The
# directory is a byte-for-byte snapshot of the source named below, taken on
# snapshot_date. Every file in the directory is listed under [[skills.files]]
# with its size in bytes and SHA-256 hash; nothing else belongs to the skill.
#
# Fields:
#   name          Installed directory name, equal to the skill's `name:`.
#   kind          "requested": one of the workflow skills F12 installs.
#                 "dependency": a helper another bundled skill invokes.
#   requested_as  Name used in the request, when it differs from `name`.
#   source_path   Where the snapshot was taken from on the author's machine.
#                 Provenance only: installation never reads it.
#   source_name   Directory name at source_path.
#   depends_on    Bundled skills this skill invokes and needs installed.
#   references    Bundled skills its text mentions without invoking them.
#   requirements  Tools, connectors or modes the skill expects at use time.
#                 Disclosed, not installed or configured by Leme.

